name: Build and Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel in-progress builds on the same branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

defaults:
  run:
    shell: bash
    working-directory: plugin

jobs:
  build_and_test:
    name: macOS Build + Validate
    runs-on: macos-14

    steps:
      - name: Install macOS Deps
        run: brew install ninja osxutils
        working-directory: .

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Build (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake -B ${{ env.BUILD_DIR }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -G Ninja
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Test (Catch2)
        working-directory: plugin/${{ env.BUILD_DIR }}
        run: ctest --verbose --output-on-failure

      - name: Read .env from CMake
        run: |
          cat .env
          cat .env >> $GITHUB_ENV

      - name: Set Artifact Paths
        run: |
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "VST3_PATH=$ARTIFACTS_PATH/VST3/${{ env.PRODUCT_NAME }}.vst3" >> $GITHUB_ENV
          echo "AU_PATH=$ARTIFACTS_PATH/AU/${{ env.PRODUCT_NAME }}.component" >> $GITHUB_ENV
          echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}.app" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ env.PRODUCT_NAME }}-${{ env.VERSION }}-macOS" >> $GITHUB_ENV

      - name: Pluginval (VST3)
        run: |
          curl -LO "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip"
          7z x pluginval_macOS.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose --validate "${{ env.VST3_PATH }}"

      - name: Pluginval (AU)
        run: |
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose --validate "${{ env.AU_PATH }}"

      - name: auval
        timeout-minutes: 5
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          sudo cp -R "${{ env.AU_PATH }}" /Library/Audio/Plug-Ins/Components/
          auval -v aufx Tnwd Manz

      # ── Code Signing (conditional on secrets) ──────────────────
      # Required secrets for signing and notarization:
      #   DEV_ID_APP_CERT          — Developer ID Application certificate (.p12 base64)
      #   DEV_ID_APP_PASSWORD      — Password for app certificate
      #   DEV_ID_INSTALLER_CERT    — Developer ID Installer certificate (.p12 base64)
      #   DEV_ID_INSTALLER_PASSWORD — Password for installer certificate
      #   DEVELOPER_ID_APPLICATION — Signing identity (e.g. "Developer ID Application: ...")
      #   DEVELOPER_ID_INSTALLER   — Installer signing identity
      #   NOTARIZATION_USERNAME    — Apple ID email
      #   NOTARIZATION_PASSWORD    — App-specific password
      #   TEAM_ID                  — Apple Developer Team ID

      - name: Import Certificates
        uses: sudara/basic-macos-keychain-action@v1
        if: ${{ secrets.DEV_ID_APP_CERT != '' }}
        id: keychain
        with:
          dev-id-app-cert: ${{ secrets.DEV_ID_APP_CERT }}
          dev-id-app-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
          dev-id-installer-cert: ${{ secrets.DEV_ID_INSTALLER_CERT }}
          dev-id-installer-password: ${{ secrets.DEV_ID_INSTALLER_PASSWORD }}

      - name: Codesign
        if: ${{ steps.keychain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION }}" -v "${{ env.VST3_PATH }}" --deep --strict --options=runtime --timestamp
          codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION }}" -v "${{ env.AU_PATH }}" --deep --strict --options=runtime --timestamp
          codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION }}" -v "${{ env.STANDALONE_PATH }}" --deep --strict --options=runtime --timestamp

      - name: Add Custom Icons
        if: ${{ steps.keychain.outcome == 'success' }}
        run: |
          sips -i packaging/pamplejuce.icns
          DeRez -only icns packaging/pamplejuce.icns > /tmp/icons
          Rez -a /tmp/icons -o "${{ env.VST3_PATH }}/Icon"$'\r'
          Rez -a /tmp/icons -o "${{ env.AU_PATH }}/Icon"$'\r'
          SetFile -a C "${{ env.VST3_PATH }}"
          SetFile -a C "${{ env.AU_PATH }}"

      # ── Packaging and Notarization ─────────────────────────────

      - name: Package and Notarize
        if: ${{ steps.keychain.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.vst3.pkg" --version ${{ env.VERSION }} --component "${{ env.VST3_PATH }}" --install-location "/Library/Audio/Plug-Ins/VST3" "packaging/${{ env.PRODUCT_NAME }}.vst3.pkg"
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.au.pkg" --version ${{ env.VERSION }} --component "${{ env.AU_PATH }}" --install-location "/Library/Audio/Plug-Ins/Components" "packaging/${{ env.PRODUCT_NAME }}.au.pkg"

          pkgbuild --analyze --root "$(dirname "${{ env.STANDALONE_PATH }}")" standalone.plist
          plutil -replace BundleIsRelocatable -bool NO standalone.plist
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.app.pkg" --version ${{ env.VERSION }} --root "$(dirname "${{ env.STANDALONE_PATH }}")" --component-plist standalone.plist --install-location "/Applications" "packaging/${{ env.PRODUCT_NAME }}.app.pkg"

          cd packaging
          envsubst < distribution.xml.template > distribution.xml
          productbuild --resources ./resources --distribution distribution.xml --sign "${{ secrets.DEVELOPER_ID_INSTALLER }}" --timestamp "${{ env.ARTIFACT_NAME }}.pkg"

          xcrun notarytool submit "${{ env.ARTIFACT_NAME }}.pkg" --apple-id ${{ secrets.NOTARIZATION_USERNAME }} --password ${{ secrets.NOTARIZATION_PASSWORD }} --team-id ${{ secrets.TEAM_ID }} --wait
          xcrun stapler staple "${{ env.ARTIFACT_NAME }}.pkg"

      # ── Upload Artifacts ───────────────────────────────────────

      - name: Upload Signed pkg
        if: ${{ steps.keychain.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}.pkg
          path: plugin/packaging/${{ env.ARTIFACT_NAME }}.pkg

      - name: Upload Unsigned Artifacts
        if: ${{ steps.keychain.outcome != 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned
          path: |
            plugin/${{ env.VST3_PATH }}
            plugin/${{ env.AU_PATH }}
            plugin/${{ env.STANDALONE_PATH }}

  # ── Release (on version tags) ────────────────────────────────

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            */*.pkg
